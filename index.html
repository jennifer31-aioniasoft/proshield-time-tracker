<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProShield Time Tracker</title>
<style>
  :root{
    --ink:#12203A; --muted:#5B6472; --line:#E1E5EB; --bg:#F5F7FA;
    --green:#1C5299; --green-d:#16417A; --red:#E4574C; --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:440px;margin:0 auto;padding:20px 16px 48px;}
  header .bar{display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:19px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  label:first-child{margin-top:0}
  input,textarea{width:100%;font-size:16px;border:1px solid var(--line);border-radius:10px;
    padding:12px;font-family:inherit;color:var(--ink);background:#fff;outline:none}
  input:focus,textarea:focus{border-color:var(--green)}
  textarea{resize:vertical}
  button{width:100%;border:0;border-radius:12px;font-size:17px;font-weight:600;padding:16px;cursor:pointer;color:#fff}
  button:disabled{opacity:.6}
  .btn-green{background:var(--green)} .btn-green:active{background:var(--green-d)}
  .btn-red{background:var(--red)}
  .btn-outline{background:#fff;color:var(--green-d);border:1px solid var(--line)}
  .tag.paused{background:#FDF1E3;color:#B4690E}
  .timer.paused{color:var(--muted)}
  .btn-ghost{background:transparent;color:var(--muted);font-weight:500;font-size:14px;padding:12px;width:auto}
  .link{background:none;color:var(--green-d);font-weight:600;font-size:14px;width:auto;padding:8px}
  .center{text-align:center}
  .timer{font-size:46px;font-weight:700;color:var(--green);margin:10px 0 2px}
  .totals{display:flex;gap:12px;margin-top:16px}
  .tot{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
  .tot .k{font-size:12px;color:var(--muted)} .tot .v{font-size:22px;font-weight:700;margin-top:2px}
  .hint{font-size:12px;color:var(--muted)}
  .sess{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .sess:first-child{border-top:0}
  .sess .did{color:var(--muted);font-size:13px;margin-top:2px}
  .tag{display:inline-block;background:#E8EEF6;color:var(--green-d);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
  .hide{display:none}
  .err{color:var(--red);font-size:13px;margin-top:8px}
  .ok{color:var(--green-d);font-size:13px;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px}
  .mono{font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:8px;margin-top:16px}
  .tabs button{background:#fff;border:1px solid var(--line);color:var(--muted);font-size:14px;padding:10px;border-radius:10px}
  .tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar">
      <div>
        <h1>ProShield Time Tracker</h1>
        <div class="sub">Clock in when you start, out when you finish.</div>
      </div>
      <button id="signOut" class="btn-ghost hide">Sign out</button>
    </div>
  </header>

  <!-- AUTH -->
  <div id="auth" class="card hide">
    <div id="signinBox">
      <label>Email</label>
      <input id="si_email" type="email" autocomplete="email" placeholder="you@proshield.com">
      <label>Password</label>
      <input id="si_pass" type="password" autocomplete="current-password" placeholder="Your password">
      <div style="margin-top:16px"><button class="btn-green" id="signinBtn">Sign in</button></div>
      <div id="si_err" class="err"></div>
      <div class="center"><button class="link" id="toSignup">New here? Create an account</button></div>
    </div>
    <div id="signupBox" class="hide">
      <label>Full name</label>
      <input id="su_name" type="text" autocomplete="name" placeholder="Your name">
      <label>Email</label>
      <input id="su_email" type="email" autocomplete="email" placeholder="you@proshield.com">
      <label>Password</label>
      <input id="su_pass" type="password" autocomplete="new-password" placeholder="Choose a password">
      <div style="margin-top:16px"><button class="btn-green" id="signupBtn">Create account</button></div>
      <div id="su_msg" class="err"></div>
      <div class="center"><button class="link" id="toSignin">Have an account? Sign in</button></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hide">
    <div class="tabs" id="tabs">
      <button id="tabMine" class="active" style="flex:1">My time</button>
      <button id="teamTab" style="flex:1;display:none">Team</button>
      <button id="tasksTab" style="flex:1;display:none">Tasks</button>
    </div>

    <!-- MY TIME -->
    <div id="mine">
      <div class="card center">
        <div id="offState">
          <div class="sub" id="hello"></div>
          <div style="margin:16px 0 4px"><button class="btn-green" id="startBtn">Start work</button></div>
        </div>
        <div id="onState" class="hide">
          <div class="tag" id="clockTag">On the clock</div>
          <div class="timer mono" id="timer">00:00:00</div>
          <div class="sub" id="startedAt"></div>
          <div style="margin-top:16px"><button class="btn-outline" id="pauseBtn">Pause</button></div>
          <div id="didWrap" class="hide" style="margin-top:16px;text-align:left">
            <label>What did you work on?</label>
            <textarea id="didInp" rows="3" placeholder="e.g. Client onboarding calls, drafted the weekly report"></textarea>
          </div>
          <div style="margin-top:10px"><button class="btn-red" id="stopBtn">Stop work</button></div>
        </div>
        <div id="mainErr" class="err"></div>
      </div>

      <div class="totals">
        <div class="tot"><div class="k">Today</div><div class="v" id="todayH">0h</div></div>
        <div class="tot"><div class="k">This week</div><div class="v" id="weekH">0h</div></div>
      </div>

      <div class="card">
        <label style="margin-bottom:4px">Your recent sessions</label>
        <div id="recent"><div class="hint">No sessions yet.</div></div>
      </div>
    </div>

    <!-- TEAM -->
    <div id="team" class="hide">
      <div class="card">
        <label style="margin-bottom:2px">Team hours</label>
        <div id="live"></div>
        <table>
          <thead><tr><th>Name</th><th class="mono">Today</th><th class="mono">This week</th></tr></thead>
          <tbody id="teamBody"></tbody>
        </table>
        <div id="teamErr" class="err"></div>
      </div>
    </div>

    <!-- TASKS (managers) -->
    <div id="tasks" class="hide">
      <div class="card">
        <label style="margin-bottom:2px">Weekly task status — pulled from ClickUp</label>
        <div id="tasksMeta" class="hint" style="margin:6px 0 8px"></div>
        <div id="tasksBody"></div>
        <div id="tasksErr" class="err"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ====== CONFIG — fill these two in (from Supabase: Project Settings -> API) ======
  var SUPABASE_URL = 'https://osacsudawfoukxujelkw.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_980hVYMs0aQh0BzEf81Hpw__Qrol1rc';
  // ================================================================================

  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  function $(id){return document.getElementById(id);}
  function round2(n){return Math.round(n*100)/100;}
  function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function weekStartLocal(){var d=new Date();var dow=(d.getDay()+6)%7;d.setHours(0,0,0,0);return d.getTime()-dow*86400000;}
  function hms(ms){var s=Math.max(0,Math.floor(ms/1000));function p(n){return(n<10?'0':'')+n;}
    return p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60);}
  function clock(iso){var d=new Date(iso);var h=d.getHours(),m=d.getMinutes();var ap=h>=12?'PM':'AM';
    h=h%12;if(h===0)h=12;return h+':'+(m<10?'0':'')+m+' '+ap;}
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){
    return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  // Worked time for a session = elapsed minus paused time (finished pauses in paused_ms, plus a pause in progress).
  function pausedMs(s,end){return (s.paused_ms||0)+(s.paused_at?Math.max(0,end-new Date(s.paused_at).getTime()):0);}
  function workedMs(s){var end=s.clock_out?new Date(s.clock_out).getTime():Date.now();
    return Math.max(0,end-new Date(s.clock_in).getTime()-pausedMs(s,end));}
  function showScreen(id){['auth','app'].forEach(function(x){$(x).classList.add('hide');});$(id).classList.remove('hide');}

  var me=null, profile=null, active=null, tick=null;

  // ---------- auth wiring ----------
  $('toSignup').onclick=function(){$('signinBox').classList.add('hide');$('signupBox').classList.remove('hide');};
  $('toSignin').onclick=function(){$('signupBox').classList.add('hide');$('signinBox').classList.remove('hide');};

  $('signinBtn').onclick=function(){
    $('si_err').textContent='';$('signinBtn').disabled=true;
    sb.auth.signInWithPassword({email:$('si_email').value.trim(),password:$('si_pass').value})
      .then(function(r){$('signinBtn').disabled=false;
        if(r.error)$('si_err').textContent=r.error.message;})
      .catch(function(){$('signinBtn').disabled=false;$('si_err').textContent='Sign-in failed. Try again.';});
  };
  $('signupBtn').onclick=function(){
    $('su_msg').className='err';$('su_msg').textContent='';$('signupBtn').disabled=true;
    sb.auth.signUp({email:$('su_email').value.trim(),password:$('su_pass').value,
      options:{data:{full_name:$('su_name').value.trim()}}})
      .then(function(r){$('signupBtn').disabled=false;
        if(r.error){$('su_msg').textContent=r.error.message;return;}
        if(!r.data.session){$('su_msg').className='ok';
          $('su_msg').textContent='Account created. If email confirmation is on, check your inbox, then sign in.';}
      })
      .catch(function(){$('signupBtn').disabled=false;$('su_msg').textContent='Sign-up failed. Try again.';});
  };
  $('signOut').onclick=function(){sb.auth.signOut();};

  sb.auth.getSession().then(function(r){handleSession(r.data.session);});
  sb.auth.onAuthStateChange(function(_e,session){handleSession(session);});

  function handleSession(session){
    if(session&&session.user){
      me=session.user;$('signOut').classList.remove('hide');
      ensureProfile().then(function(){showScreen('app');refresh();});
    }else{
      me=null;profile=null;if(tick){clearInterval(tick);tick=null;}
      $('signOut').classList.add('hide');showScreen('auth');
    }
  }
  function ensureProfile(){
    return sb.from('profiles').select('full_name,is_manager').eq('id',me.id).single()
      .then(function(r){
        profile=r.data||{full_name:me.email,is_manager:false};
        $('hello').textContent='Hi '+String(profile.full_name||me.email).split(' ')[0]+", you're off the clock.";
        $('teamTab').style.display=profile.is_manager?'':'none';
        $('tasksTab').style.display=profile.is_manager?'':'none';
      });
  }

  // ---------- tabs ----------
  $('tabMine').onclick=function(){setTab('mine');};
  $('teamTab').onclick=function(){setTab('team');loadTeam();};
  $('tasksTab').onclick=function(){setTab('tasks');loadTasks();};
  function setTab(t){
    $('mine').classList.toggle('hide',t!=='mine');
    $('team').classList.toggle('hide',t!=='team');
    $('tasks').classList.toggle('hide',t!=='tasks');
    $('tabMine').classList.toggle('active',t==='mine');
    $('teamTab').classList.toggle('active',t==='team');
    $('tasksTab').classList.toggle('active',t==='tasks');
  }

  // ---------- tasks (managers): pulled from ClickUp via a Supabase Edge Function ----------
  function loadTasks(){
    $('tasksErr').textContent='';
    $('tasksBody').innerHTML='<div class="hint">Loading tasks from ClickUp…</div>';
    $('tasksMeta').textContent='';
    sb.functions.invoke('clickup-tasks').then(function(r){
      if(r.error){$('tasksBody').innerHTML='';$('tasksErr').textContent='Could not load tasks. '+(r.error.message||'');return;}
      renderTasks(r.data);
    }).catch(function(){$('tasksBody').innerHTML='';$('tasksErr').textContent='Could not load tasks.';});
  }
  function fmtDue(iso){if(!iso)return 'no due date';var d=new Date(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
  function buildReminder(p){
    var first=(p.name||'').split(' ')[0];
    var lines=['Hi '+first+', quick check-in on your open tasks:'];
    (p.open||[]).filter(function(t){return t.overdue;}).forEach(function(t){lines.push('- '+t.title+' (overdue '+t.daysLate+' days)');});
    (p.open||[]).filter(function(t){return !t.overdue;}).forEach(function(t){lines.push('- '+t.title+(t.due?' (due '+fmtDue(t.due)+')':''));});
    lines.push('Let me know if anything is blocking you. Thanks!');
    return lines.join('\n');
  }
  window.__reminders=[];
  function copyReminder(i){
    var msg=window.__reminders[i];if(!msg)return;
    navigator.clipboard.writeText(msg).then(function(){
      var b=document.getElementById('rem'+i);if(b){var old=b.textContent;b.textContent='Copied ✓';setTimeout(function(){b.textContent=old;},1500);}
    });
  }
  function renderTasks(data){
    if(!data||!data.people){$('tasksErr').textContent='No data returned.';$('tasksBody').innerHTML='';return;}
    var when=data.generatedAt?new Date(data.generatedAt).toLocaleString():'';
    $('tasksMeta').textContent='As of '+when+' · done this week vs still open, by person';
    window.__reminders=[];
    var html=data.people.map(function(p,idx){
      var overdue=(p.open||[]).filter(function(t){return t.overdue;});
      var other=(p.open||[]).filter(function(t){return !t.overdue;});
      var rows='';
      overdue.forEach(function(t){rows+='<div class="sess"><div><div>'+esc(t.title)+'</div><div class="did" style="color:#C23B3B">Overdue '+t.daysLate+'d · '+esc(t.list)+'</div></div></div>';});
      other.forEach(function(t){rows+='<div class="sess"><div><div>'+esc(t.title)+'</div><div class="did">'+fmtDue(t.due)+' · '+esc(t.list)+'</div></div></div>';});
      if(!rows)rows='<div class="hint">Nothing open. 🎉</div>';
      window.__reminders[idx]=buildReminder(p);
      var btn=(overdue.length||other.length)?'<button id="rem'+idx+'" class="btn-ghost" style="margin-top:8px;width:auto;border:1px solid var(--line)" onclick="copyReminder('+idx+')">Copy reminder for '+esc((p.name||'').split(' ')[0])+'</button>':'';
      return '<div class="card" style="margin-top:10px">'+
        '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">'+
          '<strong>'+esc(p.name)+'</strong>'+
          '<span class="hint" style="text-align:right">'+(p.completedCount||0)+' done this week · '+overdue.length+' overdue · '+other.length+' open</span>'+
        '</div>'+
        '<div style="margin-top:8px">'+rows+'</div>'+btn+
      '</div>';
    }).join('');
    $('tasksBody').innerHTML=html||'<div class="hint">No team tasks found.</div>';
  }

  // ---------- my time ----------
  function refresh(){
    return sb.from('sessions').select('*').eq('user_id',me.id).order('clock_in',{ascending:false})
      .then(function(r){
        if(r.error){$('mainErr').textContent=r.error.message;return;}
        var rows=r.data||[];
        active=rows.filter(function(x){return !x.clock_out;})[0]||null;
        var today=ymd(new Date()),ws=weekStartLocal(),todayH=0,weekH=0,recent=[];
        rows.forEach(function(x){
          if(!x.clock_out)return;
          var h=workedMs(x)/3600000;
          if(ymd(new Date(x.clock_in))===today)todayH+=h;
          if(new Date(x.clock_in).getTime()>=ws)weekH+=h;
          recent.push(x);
        });
        $('todayH').textContent=round2(todayH)+'h';
        $('weekH').textContent=round2(weekH)+'h';
        renderRecent(recent.slice(0,10));renderClock();
      });
  }
  function renderClock(){
    if(tick){clearInterval(tick);tick=null;}
    if(active){
      $('offState').classList.add('hide');$('onState').classList.remove('hide');
      $('didWrap').classList.add('hide');$('stopBtn').textContent='Stop work';
      var paused=!!active.paused_at;
      $('clockTag').textContent=paused?'Paused':'On the clock';
      $('clockTag').classList.toggle('paused',paused);
      $('timer').classList.toggle('paused',paused);
      $('pauseBtn').textContent=paused?'Resume':'Pause';
      $('startedAt').textContent='Started at '+clock(active.clock_in)+(paused?' \u00b7 paused at '+clock(active.paused_at):'');
      var upd=function(){$('timer').textContent=hms(workedMs(active));};upd();
      if(!paused)tick=setInterval(upd,1000);
    }else{
      $('onState').classList.add('hide');$('offState').classList.remove('hide');
    }
  }
  function renderRecent(list){
    var box=$('recent');
    if(!list.length){box.innerHTML='<div class="hint">No sessions yet.</div>';return;}
    box.innerHTML=list.map(function(s){
      var h=round2(workedMs(s)/3600000);
      var br=Math.round((s.paused_ms||0)/60000);
      return '<div class="sess"><div><div>'+ymd(new Date(s.clock_in))+' &middot; '+
        clock(s.clock_in)+' \u2013 '+clock(s.clock_out)+(br?' <span class="hint">('+br+'m paused)</span>':'')+'</div>'+
        (s.description?'<div class="did">'+esc(s.description)+'</div>':'')+'</div>'+
        '<div class="mono" style="font-weight:600;white-space:nowrap">'+h+'h</div></div>';
    }).join('');
  }

  $('startBtn').onclick=function(){
    $('startBtn').disabled=true;$('mainErr').textContent='';
    sb.from('sessions').insert({user_id:me.id,clock_in:new Date().toISOString()}).select().single()
      .then(function(r){$('startBtn').disabled=false;
        if(r.error){$('mainErr').textContent=r.error.message;return;}
        active=r.data;renderClock();refresh();})
      .catch(function(){$('startBtn').disabled=false;$('mainErr').textContent='Network error. Try again.';});
  };
  $('pauseBtn').onclick=function(){
    if(!active)return;
    var now=Date.now(),upd;
    if(active.paused_at){ // resume: fold this pause into the running total
      upd={paused_at:null,paused_ms:pausedMs(active,now)};
    }else{
      upd={paused_at:new Date(now).toISOString()};
    }
    $('pauseBtn').disabled=true;$('mainErr').textContent='';
    sb.from('sessions').update(upd).eq('id',active.id).select().single()
      .then(function(r){$('pauseBtn').disabled=false;
        if(r.error){$('mainErr').textContent=r.error.message;return;}
        active=r.data;renderClock();})
      .catch(function(){$('pauseBtn').disabled=false;$('mainErr').textContent='Network error. Try again.';});
  };
  $('stopBtn').onclick=function(){
    if($('didWrap').classList.contains('hide')){
      $('didWrap').classList.remove('hide');$('stopBtn').textContent='Save & clock out';$('didInp').focus();return;
    }
    if(!active)return;
    $('stopBtn').disabled=true;$('mainErr').textContent='';
    var now=Date.now(); // stopping while paused ends the pause at the same moment
    sb.from('sessions').update({clock_out:new Date(now).toISOString(),description:$('didInp').value||'',
      paused_at:null,paused_ms:pausedMs(active,now)}).eq('id',active.id)
      .then(function(r){$('stopBtn').disabled=false;
        if(r.error){$('mainErr').textContent=r.error.message;return;}
        $('didInp').value='';active=null;refresh();})
      .catch(function(){$('stopBtn').disabled=false;$('mainErr').textContent='Network error. Try again.';});
  };

  // ---------- team (managers) ----------
  function loadTeam(){
    $('teamErr').textContent='';
    sb.from('sessions').select('*, profiles(full_name)').order('clock_in',{ascending:false})
      .then(function(r){
        if(r.error){$('teamErr').textContent=r.error.message;return;}
        var rows=r.data||[],today=ymd(new Date()),ws=weekStartLocal(),by={},live=[];
        rows.forEach(function(x){
          var name=(x.profiles&&x.profiles.full_name)||'\u2014';
          if(!by[name])by[name]={name:name,today:0,week:0};
          if(!x.clock_out){live.push(name+(x.paused_at?' (paused)':''));return;}
          var h=workedMs(x)/3600000;
          if(ymd(new Date(x.clock_in))===today)by[name].today+=h;
          if(new Date(x.clock_in).getTime()>=ws)by[name].week+=h;
        });
        var liveTxt=live.length?'On the clock now: '+live.map(esc).join(', '):'No one is clocked in right now.';
        $('live').innerHTML='<div class="hint" style="margin:6px 0 4px">'+liveTxt+'</div>';
        var people=Object.keys(by).map(function(k){return by[k];})
          .sort(function(a,b){return a.name.localeCompare(b.name);});
        $('teamBody').innerHTML=people.map(function(p){
          return '<tr><td>'+esc(String(p.name).split(' ')[0])+'</td><td class="mono">'+round2(p.today)+'h</td><td class="mono">'+round2(p.week)+'h</td></tr>';
        }).join('') || '<tr><td colspan="3" class="hint">No sessions yet.</td></tr>';
      });
  }
</script>
</body>
</html>
